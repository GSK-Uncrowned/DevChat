<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <title>DevChat — Studio</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="onboarding.css">
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="image-viewer.js"></script>
<script src="chat.js"></script>
<script src="files.js"></script>
<script src="dev-clients.js"></script>
<script src="settings.js"></script>
<script>
const { sb, $, pad, esc, initTheme, toast, requireSession, signOut } = DC;
const theme = initTheme('dev');
const STAGES = [['queued','Queued'],['reviewing','Reviewing'],['in_progress','In progress'],['feedback','Needs feedback'],['done','Done']];

let ws = null, view = 'queue', waiting = [], main, qBy = {}, min = false;
let msgClient = null, msgStop = null, searchQ = '', uid = null;
const app = $('#app');

const unread = new Set();
const seenKey = id => 'devchat-seen-' + id;
const getSeen = id => { try { return localStorage.getItem(seenKey(id)); } catch (e) { return null; } };
const setSeen = (id, t) => { try { localStorage.setItem(seenKey(id), (t || new Date()).toISOString()); } catch (e) {} };
const markSeen = id => { setSeen(id); if (unread.delete(id)) renderNav(); };

try { min = localStorage.getItem('devchat-min') === '1'; } catch (e) {}

async function boot() {
  const s = await requireSession(); if (!s) return;
  uid = s.user.id;
  const { data } = await sb.from('workspaces').select('*').eq('owner_id', uid).limit(1);
  if (!data || !data.length) return showCreate(uid);
  ws = data[0];
  await seedStyles();
  shell();
  show('queue');
  loadUnread();
  checkAlerts();
  setInterval(checkAlerts, 15000);
  sb.channel('dc-dev')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'queue_entries', filter: 'workspace_id=eq.' + ws.id }, () => { if (view === 'queue') loadQueue(); renderNowServing(); })
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: 'workspace_id=eq.' + ws.id }, p => { onMsg(p.new); setTimeout(checkAlerts, 1200); })
    .subscribe();
}

async function seedStyles() {
  const { count } = await sb.from('style_cards').select('id', { count: 'exact', head: true }).eq('workspace_id', ws.id);
  if (count) return;
  const S = [
    ['Swiss Architectural', 'Ultra-clean architectural whitespace with a floating gallery card and sharp black-and-white structure.', ['#FFFFFF','#ECECE9','#111111','#8A8A8E']],
    ['Dark Tech Product', 'Dramatic studio spotlight, floating hardware display, and glowing mint product highlights.', ['#0B0D14','#161B26','#34D399','#EEF0F5']],
    ['Warm Craft & Story', 'Rich, cozy atmosphere with classic serif headlines—ideal for coffee brands, makers, and studios.', ['#241811','#120C08','#C87D55','#F5EFE6']],
    ['Acid Agency Poster', 'High-energy poster typography with playful tape corners and sticker badges that stand out.', ['#06210C','#A3FF12','#F5F2E8','#111111']],
    ['Cosmic AI Platform', 'Luminous violet gradients, floating 3D geometric prism, and modern metric badges.', ['#090514','#261447','#A855F7','#FFFFFF']],
    ['Monochrome Editorial', 'Timeless black-and-white gallery feel designed for creators, consultants, and personal brands.', ['#09090B','#27272A','#F4F4F5','#9CA3AF']],
    ['Industrial Grid V.01', 'Structured Swiss brutalist grid with oversized index numbers and crisp monospace details.', ['#76756D','#161614','#E4E2DA','#111111']],
    ['Sticker Pop Studio', 'Bright dotted canvas with neo-brutalist outlines, tilted color stickers, and playful energy.', ['#F4F6FB','#1D4ED8','#FF4D2E','#0F172A']],
    ['Kinetic Split Gallery', 'Asymmetrical split-screen layout with a vertical project rail and dramatic focal stage.', ['#F4F3EE','#111111','#DC2626','#991B1B']],
    ['Soft Botanical Store', 'Gentle blush and sage boutique storefront with arched imagery and clean shopping badges.', ['#FDF4F5','#E8A5B5','#486856','#2B2124']],
    ['Bento Dashboard SaaS', 'Precision dark grid with live Bento UI widgets, mini sparkline charts, and product polish.', ['#0B0E14','#151A24','#38BDF8','#F4F4F5']],
    ['Luxury Travertine', 'Warm stone and gold hairline framing crafted for hospitality, real estate, and boutique brands.', ['#F6F1E7','#1F1B16','#B68A45','#D9CFC0']]
  ];
  await sb.from('style_cards').insert(S.map(([title, description, palette]) => ({ workspace_id: ws.id, title, description, palette })));
}

function showCreate(u) {
  app.innerHTML = '<div class="wrap" style="max-width:460px;padding-top:96px"><form class="stack card pad" style="padding:32px" id="cf"><div><h1>Create your studio</h1><p class="sub sm" style="margin-top:6px">This is the name your clients will see on their ticket.</p></div><label>Workspace name<input id="wn" required maxlength="60" placeholder="e.g. Northwind Studio"></label><button class="btn primary lg" type="submit">Create workspace</button></form></div>';
  $('#cf').onsubmit = async e => {
    e.preventDefault();
    const { error } = await sb.from('workspaces').insert({ owner_id: u, name: $('#wn').value.trim() });
    if (error) toast('Could not create the workspace: ' + error.message); else boot();
  };
}

const ic = d => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';
const I = {
  queue: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  messages: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  elara: '<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 17v4M17 19h4"/>',
  clients: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  invites: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
  styles: '<circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.9 0 1.5-.7 1.5-1.5 0-.4-.2-.8-.4-1-.3-.3-.4-.6-.4-1 0-.8.7-1.5 1.5-1.5H16c3.3 0 6-2.7 6-6 0-4.4-4.5-8-10-8z"/>',
  settings: '<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
  panel: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/>'
};

function shell() {
  app.innerHTML =
    '<div class="shell' + (min ? ' min' : '') + '" id="shell">' +
      '<aside class="side">' +
        '<div class="side-top">' +
          '<span class="brand"><span class="brand-ic">D</span><span class="brand-txt">DevChat</span><span class="pro-tag">STUDIO</span></span>' +
          '<button class="btn ghost sm" id="mn" aria-label="Collapse sidebar" style="padding:0 6px">' + ic(I.panel) + '</button>' +
        '</div>' +
        '<div class="search-box"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="qsearch" placeholder="Search clients..."><span class="kbd">&#8984;K</span></div>' +
        '<div><p class="sec-lbl">Navigation</p><nav class="nav-grp" id="nav"></nav></div>' +
        '<div class="side-foot">' +
          '<div id="nowSlot"></div>' +
          '<div class="between" style="padding:2px 6px">' +
            '<span class="xs muted ws-name">' + esc(ws.name) + '</span>' +
            '<div class="row" style="gap:2px"><button class="btn ghost sm" id="th" title="Theme">Theme</button><button class="btn ghost sm" id="so" title="Sign out">Out</button></div>' +
          '</div>' +
        '</div>' +
      '</aside>' +
      '<div class="canvas">' +
        '<div class="urgent-bar" id="urgentBar" hidden role="alert"></div>' +
        '<header class="topbar">' +
          '<div class="crumb" id="crumb">Overview</div>' +
          '<div class="seg" role="group" aria-label="Availability" id="availBar"></div>' +
        '</header>' +
        '<main class="content" id="main"></main>' +
      '</div>' +
    '</div>';

  main = $('#main');
  $('#th').onclick = () => theme.toggle();
  $('#so').onclick = signOut;
  $('#mn').onclick = () => {
    min = !min;
    $('#shell').classList.toggle('min', min);
    try { localStorage.setItem('devchat-min', min ? '1' : '0'); } catch (e) {}
  };
  $('#qsearch').addEventListener('input', e => {
    searchQ = e.target.value.trim().toLowerCase();
    if (view === 'messages' && !msgClient) loadMessages();
    else if (view === 'clients') DevClients.show(searchQ);
  });
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); const s = $('#qsearch'); if (s) s.focus(); }
  });

  $('#nav').onclick = e => {
    const b = e.target.closest('button[data-v]');
    if (b) show(b.dataset.v);
  };
  $('#availBar').onclick = async e => {
    const b = e.target.closest('button[data-status]'); if (!b) return;
    await sb.from('workspaces').update({ status: b.dataset.status }).eq('id', ws.id);
    ws.status = b.dataset.status;
    renderAvail();
    toast('Status: ' + ws.status);
  };

  main.addEventListener('click', onClick);
  main.addEventListener('change', onChange);
  DevClients.init(main, ws, openClient, openMessageThread);
  Settings.init(main, ws);
  renderAvail();
  renderNowServing();
}

// Loud, impossible-to-ignore Operator Alert when a client asks for a real person
async function checkAlerts() {
  if (!ws) return;
  const bar = $('#urgentBar'); if (!bar) return;
  const { data } = await sb.from('activity_log').select('id,client_id,kind,meta,created_at').eq('workspace_id', ws.id).in('kind', ['needs_developer', 'ai_ack']).order('created_at', { ascending: false }).limit(40);
  const acks = new Set((data || []).filter(x => x.kind === 'ai_ack').map(x => (x.meta || {}).ack_id));
  try { JSON.parse(localStorage.getItem('devchat-ack-' + ws.id) || '[]').forEach(id => acks.add(id)); } catch (e) {}
  const active = (data || []).filter(x => x.kind === 'needs_developer' && !acks.has(x.id));

  if (!active.length) {
    bar.hidden = true;
    document.title = 'DevChat — Studio';
    return;
  }
  const top = active[0], m = top.meta || {};
  document.title = '(!) Real person requested — DevChat';
  bar.hidden = false;
  bar.innerHTML =
    '<div class="urgent-left">' +
      '<span class="urgent-beacon" aria-hidden="true"></span>' +
      '<span class="urgent-tag">Operator requested</span>' +
      '<div><strong>' + esc(m.client_name || 'A client') + ' ' + (m.ticket_no ? pad(m.ticket_no) : '') + '</strong> <span class="sm sub">&mdash; ' + esc(m.reason || m.summary || 'Asked to speak to a real person') + '</span>' + (active.length > 1 ? ' <span class="badge">+' + (active.length - 1) + ' more</span>' : '') + '</div>' +
    '</div>' +
    '<div class="row">' +
      '<button class="btn primary sm" id="urgJump">Jump to chat</button>' +
      '<button class="btn sm" id="urgDismiss">Dismiss</button>' +
    '</div>';

  const ackAlert = async () => {
    try {
      const prev = JSON.parse(localStorage.getItem('devchat-ack-' + ws.id) || '[]');
      localStorage.setItem('devchat-ack-' + ws.id, JSON.stringify([...new Set([...prev, top.id])].slice(-100)));
    } catch (e) {}
    await DC.log(ws.id, top.client_id, 'ai_ack', { ack_id: top.id }, false);
    checkAlerts();
  };
  $('#urgDismiss').onclick = ackAlert;
  $('#urgJump').onclick = async () => {
    const { data: cl } = await sb.from('clients').select('id,display_name').eq('id', top.client_id).maybeSingle();
    await ackAlert();
    if (cl) openMessageThread(cl);
  };
}

function renderAvail() {
  $('#availBar').innerHTML = ['open', 'paused', 'away'].map(s =>
    '<button data-status="' + s + '" aria-pressed="' + (ws.status === s) + '">' + s[0].toUpperCase() + s.slice(1) + '</button>'
  ).join('');
}

async function renderNowServing() {
  const slot = $('#nowSlot'); if (!slot) return;
  const { data } = await sb.from('queue_entries').select('client_id,ticket_no').eq('workspace_id', ws.id).eq('state', 'active').order('sort_key').limit(1);
  if (!data || !data.length) { slot.innerHTML = ''; return; }
  const { data: cl } = await sb.from('clients').select('id,display_name').eq('id', data[0].client_id).maybeSingle();
  if (!cl) { slot.innerHTML = ''; return; }
  slot.innerHTML = '<button class="side-now" id="sideNow"><span class="xs muted row" style="gap:6px"><span class="dot"></span>NOW SERVING</span><strong class="sm">' + pad(data[0].ticket_no) + ' &middot; ' + esc(cl.display_name) + '</strong></button>';
  $('#sideNow').onclick = () => openClient(cl, 'Overview');
}

function renderNav() {
  const items = [
    ['queue', I.queue, 'Overview', ''],
    ['messages', I.messages, 'Messages', unread.size ? '<span class="nav-cnt hi">' + unread.size + '</span>' : ''],
    ['elara', I.elara, 'Elara', '<span class="nav-cnt">AI</span>'],
    ['clients', I.clients, 'Clients', ''],
    ['invites', I.invites, 'Invites', ''],
    ['styles', I.styles, 'Styles', ''],
    ['settings', I.settings, 'Settings', '']
  ];
  $('#nav').innerHTML = items.map(([k, icon, label, extra]) =>
    '<button class="nav-it" data-v="' + k + '"' + (view === k ? ' aria-current="true"' : '') + '>' +
      ic(icon) + '<span class="lb">' + label + '</span>' + extra +
    '</button>'
  ).join('');
}

async function loadUnread() {
  const { data } = await sb.from('messages').select('client_id,created_at').eq('workspace_id', ws.id).eq('sender_kind', 'client').order('created_at', { ascending: false }).limit(300);
  const latest = {}; (data || []).forEach(m => { if (!latest[m.client_id]) latest[m.client_id] = m.created_at; });
  Object.entries(latest).forEach(([id, t]) => { const s = getSeen(id); if (s === null) setSeen(id); else if (new Date(t) > new Date(s)) unread.add(id); });
  renderNav();
}

function onMsg(m) {
  if (m.sender_kind !== 'client') return;
  if (view === 'messages' && msgClient && msgClient.id === m.client_id) return markSeen(m.client_id);
  if (getSeen(m.client_id) === null) setSeen(m.client_id, new Date(Date.now() - 1000));
  unread.add(m.client_id);
  renderNav();
  if (view === 'messages' && !msgClient) loadMessages();
}

function stopMsg() {
  if (msgStop) { msgStop(); msgStop = null; }
}

function show(v) {
  stopMsg();
  msgClient = null;
  view = v;
  renderNav();
  if (v === 'queue') { $('#crumb').textContent = 'Overview'; loadQueue(); }
  else if (v === 'messages') { $('#crumb').textContent = 'Messages'; loadMessages(); }
  else if (v === 'elara') { $('#crumb').textContent = 'Elara'; ElaraGlobal.show(main, ws, uid, openMessageThread); }
  else if (v === 'clients') { $('#crumb').textContent = 'Clients'; DevClients.show(searchQ); }
  else if (v === 'invites') { $('#crumb').textContent = 'Invites'; loadInvites(); }
  else if (v === 'styles') { $('#crumb').textContent = 'Styles'; Settings.styles(); }
  else if (v === 'settings') { $('#crumb').textContent = 'Settings'; Settings.show(); }
}

async function openClient(c, t) {
  if (!c) return;
  stopMsg();
  view = 'clients';
  renderNav();
  $('#crumb').innerHTML = '<button class="btn ghost sm" id="crumbBack">&larr; Clients</button> <span class="muted">/</span> <span>' + esc(c.display_name) + '</span>';
  $('#crumbBack').onclick = () => show('clients');
  await DevClients.open(c, t || 'Overview', () => show('clients'));
}

async function openMessageThread(c) {
  if (!c) return;
  view = 'messages';
  msgClient = c;
  markSeen(c.id);
  renderNav();
  await loadMessages();
}

const stageSel = (id, cur) => '<select class="compact" data-stage="' + id + '" aria-label="Stage">' + STAGES.map(([v, l]) => '<option value="' + v + '"' + (v === cur ? ' selected' : '') + '>' + l + '</option>').join('') + '</select>';

async function loadQueue() {
  const weekAgo = new Date(Date.now() - 6 * 864e5); weekAgo.setHours(0,0,0,0);
  const [q, c, m] = await Promise.all([
    sb.from('queue_entries').select('client_id,ticket_no,sort_key,state').eq('workspace_id', ws.id).in('state', ['waiting', 'active']).order('sort_key'),
    sb.from('clients').select('id,display_name,stage').eq('workspace_id', ws.id),
    sb.from('messages').select('created_at').eq('workspace_id', ws.id).gte('created_at', weekAgo.toISOString())
  ]);
  if (q.error || c.error) { toast('Could not load the queue.'); return; }
  const by = {}; c.data.forEach(x => by[x.id] = x);
  qBy = by;
  const active = q.data.filter(e => e.state === 'active');
  waiting = q.data.filter(e => e.state === 'waiting');
  const doneCount = c.data.filter(x => x.stage === 'done').length;

  const msgs = m.data || [];
  const days = [...Array(7)].map((_, i) => {
    const d = new Date(Date.now() - (6 - i) * 864e5);
    return { l: d.toLocaleDateString(undefined, { weekday: 'short' }), n: msgs.filter(x => new Date(x.created_at).toDateString() === d.toDateString()).length };
  });
  const mx = Math.max(1, ...days.map(d => d.n));

  const actCard = active.length
    ? active.map(e => {
        const cl = by[e.client_id] || { id: e.client_id, display_name: 'Client', stage: 'in_progress' };
        return '<div class="card kpi-card" style="border-left:3px solid var(--accent)">' +
          '<div class="between"><span class="kpi-lbl">Now serving &middot; ' + pad(e.ticket_no) + '</span>' + stageSel(e.client_id, cl.stage) + '</div>' +
          '<div style="font-size:22px;font-weight:600;letter-spacing:-.02em">' + esc(cl.display_name) + '</div>' +
          '<div class="row">' +
            '<button class="btn sm" data-act="chat" data-id="' + e.client_id + '">Message</button>' +
            '<button class="btn sm" data-act="open" data-id="' + e.client_id + '">Open project</button>' +
            '<button class="btn primary sm" data-act="done" data-id="' + e.client_id + '">Mark done</button>' +
          '</div>' +
        '</div>';
      }).join('')
    : '<div class="card kpi-card"><span class="kpi-lbl">Now serving</span><p class="sub sm">No one is active right now.</p>' + (waiting.length ? '<div><button class="btn primary sm" data-act="start" data-id="' + waiting[0].client_id + '">Start next (' + pad(waiting[0].ticket_no) + ')</button></div>' : '') + '</div>';

  const upNext = waiting.length
    ? waiting.map((e, i) => {
        const cl = by[e.client_id] || { display_name: 'Client' };
        return '<div class="qitem">' +
          '<span class="mono sm muted">' + pad(e.ticket_no) + '</span>' +
          '<div><strong>' + esc(cl.display_name) + '</strong><p class="xs muted">Est. start in ~' + ((i + 1) * ws.est_days_per_client) + 'd</p></div>' +
          '<div class="row">' +
            '<button class="btn ghost sm" data-act="up" data-id="' + e.client_id + '"' + (i === 0 ? ' disabled' : '') + '>Up</button>' +
            '<button class="btn ghost sm" data-act="down" data-id="' + e.client_id + '"' + (i === waiting.length - 1 ? ' disabled' : '') + '>Down</button>' +
            '<button class="btn sm" data-act="start" data-id="' + e.client_id + '">Start</button>' +
          '</div>' +
        '</div>';
      }).join('')
    : '<div class="empty" style="padding:28px"><p class="sub sm">Nobody is waiting in line.</p></div>';

  main.innerHTML =
    '<div class="hero-row"><div><h1>Welcome back!</h1><p class="sub sm" style="margin-top:4px">Here is what is happening across your client queue.</p></div><button class="btn primary" data-go="invites">+ Create invite</button></div>' +
    '<div class="bento-3">' +
      actCard +
      '<div class="card kpi-card"><span class="kpi-lbl">Waiting in queue</span><div class="kpi-val">' + String(waiting.length).padStart(2, '0') + '</div><span class="delta">~' + (waiting.length * ws.est_days_per_client) + ' days total pace</span></div>' +
      '<div class="card kpi-card"><span class="kpi-lbl">Completed</span><div class="kpi-val">' + String(doneCount).padStart(2, '0') + '</div><span class="delta">' + c.data.length + ' total clients</span></div>' +
    '</div>' +
    '<div class="bento-2">' +
      '<div class="card chart-card">' +
        '<div class="between" style="align-items:flex-start"><div><span class="kpi-lbl">Messages this week</span><div class="kpi-val" style="margin-top:8px">' + msgs.length + '</div></div><span class="badge on">Last 7 days</span></div>' +
        '<div class="pill-bars">' + days.map((d, idx) => '<div class="pb-col"><div class="pb-track"><div class="pb-fill' + (d.n && (idx === 6 || d.n === mx) ? ' hi' : '') + '" style="height:' + Math.max(12, d.n / mx * 100) + '%" title="' + d.n + ' messages"></div></div><span class="xs muted mono">' + d.l + '</span></div>').join('') + '</div>' +
      '</div>' +
      '<div class="card qcard"><div class="between"><h2>Up next in line</h2><span class="xs muted">' + waiting.length + ' waiting</span></div>' + upNext + '</div>' +
    '</div>';
}

async function loadMessages() {
  stopMsg();
  if (msgClient) {
    const { data: q } = await sb.from('queue_entries').select('ticket_no').eq('client_id', msgClient.id).maybeSingle();
    const ini = (msgClient.display_name || '?').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
    $('#crumb').innerHTML = '<button class="btn ghost sm" id="mBack">&larr; Messages</button> <span class="muted">/</span> <span>' + esc(msgClient.display_name) + '</span>';
    $('#mBack').onclick = () => { msgClient = null; loadMessages(); };

    main.innerHTML = '<div class="msg-wrap" id="mThread"></div>';
    msgStop = await Chat.mount($('#mThread'), {
      clientId: msgClient.id, workspaceId: ws.id, kind: 'developer', uid, canDelete: true, mention: true,
      title: msgClient.display_name, initials: ini, ticket: q ? pad(q.ticket_no) : '',
      onBack: () => { msgClient = null; loadMessages(); },
      onProject: () => openClient(msgClient, 'Overview'),
      afterSend: async m => {
        if (!Chat.isMention(m.body)) return null;
        const { data, error } = await sb.functions.invoke('mention', { body: { client_id: msgClient.id, message_id: m.id } });
        if (error || !data || data.error) { toast('Elara could not answer right now.'); return null; }
        if (data.workspace_status) { ws.status = data.workspace_status; renderAvail(); }
        if (data.status) toast('Client sees: ' + data.status);
        return data;
      }
    });
    return;
  }

  $('#crumb').textContent = 'Messages';
  const [c, q, m] = await Promise.all([
    sb.from('clients').select('id,display_name,stage,created_at').eq('workspace_id', ws.id),
    sb.from('queue_entries').select('client_id,ticket_no').eq('workspace_id', ws.id),
    sb.from('messages').select('client_id,body,sender_kind,created_at').eq('workspace_id', ws.id).order('created_at', { ascending: false }).limit(400)
  ]);
  const t = {}; (q.data || []).forEach(x => t[x.client_id] = x.ticket_no);
  const last = {}; (m.data || []).forEach(x => { if (!last[x.client_id]) last[x.client_id] = x; });
  const list = (c.data || [])
    .filter(x => !searchQ || x.display_name.toLowerCase().includes(searchQ))
    .sort((a, b) => new Date((last[b.id] || b).created_at) - new Date((last[a.id] || a).created_at));

  const fmt = iso => { try { const d = new Date(iso); return d.toDateString() === new Date().toDateString() ? d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : d.toLocaleDateString(); } catch (e) { return ''; } };
  const ini = n => (n || '?').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();

  main.innerHTML =
    '<div class="msg-wrap">' +
      '<div class="hero-row" style="margin-bottom:14px"><h1>Messages</h1><span class="sm muted">' + list.length + ' conversations</span></div>' +
      (list.length
        ? '<div class="card clip">' + list.map(cl => {
            const lm = last[cl.id], hasUn = unread.has(cl.id);
            return '<button class="msg-row" data-open-msg="' + cl.id + '">' +
              '<span class="av' + (hasUn ? ' on' : '') + '">' + esc(ini(cl.display_name)) + '</span>' +
              '<div style="min-width:0"><div class="row" style="gap:8px"><strong style="font-size:14.5px">' + esc(cl.display_name) + '</strong><span class="xs mono muted">' + pad(t[cl.id] || 0) + '</span></div>' +
              '<p class="sm ' + (hasUn ? '' : 'sub') + '" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px">' + esc(lm ? lm.body : 'No messages yet') + '</p></div>' +
              '<div style="display:grid;justify-items:end;gap:6px"><span class="xs muted">' + fmt((lm || cl).created_at) + '</span>' + (hasUn ? '<span class="unread-dot"></span>' : '') + '</div>' +
            '</button>';
          }).join('') + '</div>'
        : '<div class="card empty"><h2>No conversations</h2><p class="sub sm">Invite a client to start chatting.</p></div>') +
    '</div>';

  main.querySelectorAll('[data-open-msg]').forEach(b => b.onclick = () => {
    const cl = list.find(x => x.id === b.dataset.openMsg);
    openMessageThread(cl);
  });
}

async function loadInvites() {
  const { data, error } = await sb.from('invites').select('*').eq('workspace_id', ws.id).order('created_at', { ascending: false });
  if (error) return toast('Could not load invites.');
  const link = c => new URL('index.html?code=' + c, location.href).href;
  main.innerHTML =
    '<div class="hero-row"><div><h1>Invites</h1><p class="sub sm" style="margin-top:4px">Each code works once and expires in 7 days.</p></div><button class="btn primary" data-act="newinvite">+ Create invite</button></div>' +
    (data.length
      ? '<div class="card clip">' + data.map(i => {
          const dead = i.revoked || new Date(i.expires_at) < new Date() || i.uses >= i.max_uses;
          return '<div class="item"><div><div class="row"><span class="code">' + esc(i.code) + '</span><span class="badge' + (dead ? '' : ' on') + '">' + (i.revoked ? 'Revoked' : dead ? 'Used or expired' : 'Active') + '</span></div><p class="muted xs" style="margin-top:4px">' + (dead ? 'No longer redeemable' : 'Expires ' + new Date(i.expires_at).toLocaleDateString()) + '</p></div>' +
            '<span class="row">' + (dead ? '' : '<button class="btn sm" data-qr="' + esc(link(i.code)) + '">QR</button><button class="btn sm" data-copy="' + esc(link(i.code)) + '">Copy link</button><button class="btn ghost sm" data-act="revoke" data-id="' + i.id + '">Revoke</button>') + '</span></div>';
        }).join('') + '</div>'
      : '<div class="card empty"><h2>No invites yet</h2><p class="sub sm">Create an invite link to bring in your first client.</p></div>');
}

async function showQr(link) {
  if (!window.QRCode) await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s); }).catch(() => {});
  if (!window.QRCode) return toast('Could not load the QR code tool.');
  const url = await QRCode.toDataURL(link, { width: 260, margin: 2 });
  const d = document.createElement('dialog'); d.className = 'modal';
  d.innerHTML = '<div class="stack" style="justify-items:center"><h2>Scan to join</h2><img src="' + url + '" width="240" height="240" alt="QR code" style="border-radius:12px;background:#fff;padding:6px"><p class="muted xs" style="word-break:break-all;text-align:center">' + esc(link) + '</p><button class="btn" data-x>Close</button></div>';
  document.body.appendChild(d); d.addEventListener('close', () => d.remove());
  d.addEventListener('click', e => { if (e.target === d || e.target.closest('[data-x]')) d.close(); });
  d.showModal();
}

async function onClick(e) {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.go) return show(t.dataset.go);
  if (t.dataset.qr) return showQr(t.dataset.qr);
  if (t.dataset.copy) { try { await navigator.clipboard.writeText(t.dataset.copy); toast('Link copied.'); } catch (x) { toast(t.dataset.copy); } return; }
  const id = t.dataset.id, act = t.dataset.act; if (!act) return;
  if (act === 'chat') return openMessageThread(qBy[id]);
  if (act === 'open') return openClient(qBy[id], 'Overview');
  if (act === 'newinvite') { const { error } = await sb.rpc('create_invite', { p_workspace: ws.id, p_days: 7, p_max_uses: 1 }); if (error) toast('Could not create the invite.'); return loadInvites(); }
  if (act === 'revoke') { await sb.from('invites').update({ revoked: true }).eq('id', id); return loadInvites(); }
  if (act === 'start') await Promise.all([sb.from('queue_entries').update({ state: 'active' }).eq('client_id', id), sb.from('clients').update({ stage: 'in_progress' }).eq('id', id)]);
  if (act === 'done') await Promise.all([sb.from('queue_entries').update({ state: 'done' }).eq('client_id', id), sb.from('clients').update({ stage: 'done' }).eq('id', id)]);
  if (act === 'start' || act === 'done') { DC.log(ws.id, id, 'stage_changed', { stage: act === 'start' ? 'in_progress' : 'done' }, true); renderNowServing(); }
  if (act === 'up' || act === 'down') {
    const i = waiting.findIndex(x => x.client_id === id), j = i + (act === 'up' ? -1 : 1);
    if (i < 0 || j < 0 || j >= waiting.length) return;
    const a = waiting[i], b = waiting[j];
    await Promise.all([sb.from('queue_entries').update({ sort_key: b.sort_key }).eq('client_id', a.client_id), sb.from('queue_entries').update({ sort_key: a.sort_key }).eq('client_id', b.client_id)]);
  }
  loadQueue();
}

async function onChange(e) {
  const s = e.target.closest('select[data-stage]'); if (!s) return;
  const { error } = await sb.from('clients').update({ stage: s.value }).eq('id', s.dataset.stage);
  toast(error ? 'Could not change the stage.' : 'Stage updated.');
  if (!error) DC.log(ws.id, s.dataset.stage, 'stage_changed', { stage: s.value }, true);
}
boot();
</script>
