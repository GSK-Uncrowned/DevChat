<!doctype html><html lang="en" data-theme="dark"><head><title>DevChat</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap"><link rel="stylesheet" href="styles.css"></head><body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="config.js"></script><script src="app.js"></script><script src="chat.js"></script><script src="dev-clients.js"></script>
<script>
const { sb, $, pad, esc, initTheme, toast, requireSession, signOut } = DC;
const theme = initTheme('dev');
const STAGES = [['queued','Queued'],['reviewing','Reviewing'],['in_progress','In progress'],['feedback','Needs feedback'],['done','Done']];
let ws = null, view = 'queue', waiting = [], main;
const app = $('#app');

async function boot() {
  const s = await requireSession(); if (!s) return;
  const { data } = await sb.from('workspaces').select('*').eq('owner_id', s.user.id).limit(1);
  if (!data || !data.length) return showCreate(s.user.id);
  ws = data[0]; await seedStyles(); shell(); show('queue');
  sb.channel('dc-dev').on('postgres_changes', { event: '*', schema: 'public', table: 'queue_entries', filter: 'workspace_id=eq.' + ws.id }, () => { if (view === 'queue') loadQueue(); }).subscribe();
}
async function seedStyles() {
  const { count } = await sb.from('style_cards').select('id', { count: 'exact', head: true }).eq('workspace_id', ws.id);
  if (count) return;
  const P = [['Minimal mono', '#ffffff,#111111,#8a8a8a'], ['Soft floral', '#fdf2f4,#e8a0b4,#4a6b4f'], ['Dark tech', '#0b0d14,#4cc38a,#eef0f5'], ['Playful bright', '#fff3d6,#ff6b4a,#2b59ff'], ['Warm editorial', '#f7f4ee,#9a5b00,#1f1b16'], ['Bold contrast', '#000000,#ffffff,#f0b24a']];
  await sb.from('style_cards').insert(P.map(([title, p]) => ({ workspace_id: ws.id, title, palette: p.split(',') })));
}
function showCreate(uid) {
  app.innerHTML = '<div class="wrap" style="max-width:480px;padding-top:96px"><form class="stack panel" style="padding:28px" id="cf"><div><h1 style="font-size:28px">Create your workspace</h1><p class="sub small" style="margin-top:4px">This is the name your clients will see.</p></div><label>Workspace name<input id="wn" required maxlength="60"></label><button class="btn primary lg" type="submit">Create workspace</button></form></div>';
  $('#cf').onsubmit = async e => { e.preventDefault(); const { error } = await sb.from('workspaces').insert({ owner_id: uid, name: $('#wn').value.trim() }); if (error) { console.error(error); toast('Could not create the workspace: ' + error.message); } else boot(); };
}
function shell() {
  app.innerHTML = '<div class="app"><aside class="side"><div><span class="mark">DevChat</span><p class="muted small" style="padding:0 10px">' + esc(ws.name) + '</p></div><nav class="nav"><button data-v="queue">Queue</button><button data-v="clients">Clients</button><button data-v="invites">Invites</button></nav><div class="foot"><button class="btn ghost sm" id="th">Theme</button><button class="btn ghost sm" id="so">Sign out</button></div></aside><main class="main" id="main"></main></div>';
  main = $('#main');
  document.querySelectorAll('.nav button').forEach(b => b.onclick = () => show(b.dataset.v));
  $('#th').onclick = () => theme.toggle(); $('#so').onclick = signOut;
  main.addEventListener('click', onClick); main.addEventListener('change', onChange);
}
function show(v) {
  view = v;
  document.querySelectorAll('.nav button').forEach(b => b.setAttribute('aria-current', b.dataset.v === v));
  v === 'queue' ? loadQueue() : v === 'clients' ? DevClients.show(main, ws) : loadInvites();
}
const stageSel = (id, cur) => '<select data-stage="' + id + '" aria-label="Stage">' + STAGES.map(([v, l]) => '<option value="' + v + '"' + (v === cur ? ' selected' : '') + '>' + l + '</option>').join('') + '</select>';

async function loadQueue() {
  const [q, c] = await Promise.all([
    sb.from('queue_entries').select('client_id,ticket_no,sort_key,state').eq('workspace_id', ws.id).in('state', ['waiting', 'active']).order('sort_key'),
    sb.from('clients').select('id,display_name,stage').eq('workspace_id', ws.id)
  ]);
  if (q.error || c.error) { const er = q.error || c.error; console.error(er); toast('Could not load the queue: ' + er.message); return; }
  const by = {}; c.data.forEach(x => by[x.id] = x);
  const active = q.data.filter(e => e.state === 'active'); waiting = q.data.filter(e => e.state === 'waiting');
  const who = e => esc((by[e.client_id] || {}).display_name || 'Client');
  const st = e => (by[e.client_id] || {}).stage;
  let h = '<header class="page-h"><div><h1>Queue</h1><p class="sub small">' + waiting.length + ' waiting</p></div><div class="seg" role="group" aria-label="Availability">' +
    ['open', 'paused', 'away'].map(s => '<button data-status="' + s + '" aria-pressed="' + (ws.status === s) + '">' + s[0].toUpperCase() + s.slice(1) + '</button>').join('') + '</div></header>';
  if (!q.data.length) {
    h += '<div class="panel empty"><h2>No one is in line yet</h2><p class="sub small">Create an invite and send it to your first client.</p><button class="btn primary" data-go="invites">Create an invite</button></div>';
  } else {
    h += '<p class="sec">Now serving</p><div class="panel serving">' + (active.length ? active.map(e => '<div class="item"><span class="tno">' + pad(e.ticket_no) + '</span><span>' + who(e) + '</span><span class="row-gap">' + stageSel(e.client_id, st(e)) + '<button class="btn sm" data-act="done" data-id="' + e.client_id + '">Mark done</button></span></div>').join('') : '<div class="item"><span></span><span class="sub">No one is being served.</span><span></span></div>') + '</div>';
    h += '<p class="sec">Waiting</p><div class="panel">' + (waiting.length ? waiting.map((e, i) => '<div class="item"><span class="tno">' + pad(e.ticket_no) + '</span><span>' + who(e) + '</span><span class="row-gap"><button class="btn ghost sm" data-act="up" data-id="' + e.client_id + '"' + (i === 0 ? ' disabled' : '') + ' aria-label="Move up">Up</button><button class="btn ghost sm" data-act="down" data-id="' + e.client_id + '"' + (i === waiting.length - 1 ? ' disabled' : '') + ' aria-label="Move down">Down</button><button class="btn sm" data-act="start" data-id="' + e.client_id + '">Start</button></span></div>').join('') : '<div class="item"><span></span><span class="sub">Nobody is waiting.</span><span></span></div>') + '</div>';
  }
  main.innerHTML = h;
}

async function loadInvites() {
  const { data, error } = await sb.from('invites').select('*').eq('workspace_id', ws.id).order('created_at', { ascending: false });
  if (error) { console.error(error); toast('Could not load invites: ' + error.message); return; }
  const link = c => new URL('index.html?code=' + c, location.href).href;
  main.innerHTML = '<header class="page-h"><div><h1>Invites</h1><p class="sub small">Each code works once and expires in 7 days.</p></div><button class="btn primary" data-act="newinvite">Create invite</button></header>' +
    (data.length ? '<div class="panel">' + data.map(i => {
      const dead = i.revoked || new Date(i.expires_at) < new Date() || i.uses >= i.max_uses;
      return '<div class="item" style="grid-template-columns:1fr auto"><span><span class="code">' + esc(i.code) + '</span><br><span class="muted small">' + (i.revoked ? 'Revoked' : dead ? 'Used or expired' : 'Active, expires ' + new Date(i.expires_at).toLocaleDateString()) + '</span></span>' +
        '<span class="row-gap">' + (dead ? '' : '<button class="btn sm" data-copy="' + esc(link(i.code)) + '">Copy link</button><button class="btn ghost sm" data-act="revoke" data-id="' + i.id + '">Revoke</button>') + '</span></div>';
    }).join('') + '</div>' : '<div class="panel empty"><h2>No invites yet</h2><p class="sub small">Create one and send the link to a client.</p></div>');
}

async function onClick(e) {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.go) return show(t.dataset.go);
  if (t.dataset.status) { await sb.from('workspaces').update({ status: t.dataset.status }).eq('id', ws.id); ws.status = t.dataset.status; return loadQueue(); }
  if (t.dataset.copy) { try { await navigator.clipboard.writeText(t.dataset.copy); toast('Link copied.'); } catch (x) { toast(t.dataset.copy); } return; }
  const id = t.dataset.id, act = t.dataset.act; if (!act) return;
  if (act === 'newinvite') { const { error } = await sb.rpc('create_invite', { p_workspace: ws.id, p_days: 7, p_max_uses: 1 }); if (error) toast('Could not create the invite.'); return loadInvites(); }
  if (act === 'revoke') { await sb.from('invites').update({ revoked: true }).eq('id', id); return loadInvites(); }
  if (act === 'start') await Promise.all([sb.from('queue_entries').update({ state: 'active' }).eq('client_id', id), sb.from('clients').update({ stage: 'in_progress' }).eq('id', id)]);
  if (act === 'done') await Promise.all([sb.from('queue_entries').update({ state: 'done' }).eq('client_id', id), sb.from('clients').update({ stage: 'done' }).eq('id', id)]);
  if (act === 'up' || act === 'down') {
    const i = waiting.findIndex(x => x.client_id === id), j = i + (act === 'up' ? -1 : 1);
    if (i < 0 || j < 0 || j >= waiting.length) return;
    const a = waiting[i], b = waiting[j];
    await Promise.all([sb.from('queue_entries').update({ sort_key: b.sort_key }).eq('client_id', a.client_id), sb.from('queue_entries').update({ sort_key: a.sort_key }).eq('client_id', b.client_id)]);
  }
  loadQueue();
}
async function onChange(e) {
  const s = e.target.closest('select[data-stage]'); if (!s) return;
  const { error } = await sb.from('clients').update({ stage: s.value }).eq('id', s.dataset.stage);
  toast(error ? 'Could not change the stage.' : 'Stage updated.');
}
boot();
</script></body></html>
